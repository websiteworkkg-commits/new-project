<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ONL ACTIVATE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B1F4B;--blue:#2447D6;--mint:#12B5A0;--mintbg:#E4F7F4;--bg:#EEF1F7;--ink:#10193A;--mut:#6B7592;--line:#E3E8F2;--warn:#C2410C;--r:20px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--navy);color:#fff}
.brand{font-weight:800;font-size:18px}.brand b{color:#5EEAD4}.tag{font-size:12px;opacity:.8}
.seg{display:flex;background:#ffffff22;border-radius:99px;padding:3px}.seg button{padding:7px 14px;border-radius:99px;color:#fff;font-weight:600;font-size:13px}.seg button.on{background:#fff;color:var(--navy)}
.pill{font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px;background:#ffffff1f;color:#fff}.pill:hover{background:#ffffff38}
.stage{display:flex;justify-content:center;gap:28px;padding:24px 12px;flex-wrap:wrap}
.phone{width:390px;max-width:100%;height:790px;background:#fff;border-radius:42px;box-shadow:0 30px 60px #0b1f4b2e,0 0 0 8px var(--navy);display:flex;flex-direction:column;overflow:hidden;position:relative}
.scr{flex:1;overflow-y:auto;padding:22px 20px 16px}
.nav{display:flex;border-top:1px solid var(--line);padding:6px 4px 10px;background:#fff}.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mut);padding:6px 0;border-radius:12px}.nav button.on{color:var(--blue)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1{font-size:26px;line-height:1.15;margin:6px 0 8px;letter-spacing:-.02em}h2{font-size:18px;margin:18px 0 10px}h3{font-size:15px;margin:0 0 3px}p{margin:0 0 10px}.mut{color:var(--mut);font-size:13px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 4px 14px #0b1f4b0d}
.hero{background:linear-gradient(145deg,var(--navy),var(--blue));color:#fff;border:0}.hero .mut{color:#cdd8ff}
.btn{display:block;width:100%;padding:14px;border-radius:16px;font-weight:700;background:var(--blue);color:#fff;text-align:center}.btn.m{background:var(--mint)}.btn.g{background:#fff;color:var(--blue);border:1.5px solid var(--line)}.btn.sm{width:auto;display:inline-block;padding:8px 14px;font-size:13px;border-radius:12px}.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}.grow{flex:1;min-width:0}
.ico{width:40px;height:40px;border-radius:13px;background:#EAF0FF;color:var(--blue);display:grid;place-items:center;flex:none}.ico.m{background:var(--mintbg);color:var(--mint)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--mint);border-radius:9px;transition:width .4s}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:#fff}.chk.d{background:var(--mint);border-color:var(--mint)}
.step{width:100%;text-align:left;display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:16px;margin-bottom:8px;background:#fff}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--mintbg);color:#0B7C6D}.badge.o{background:#FFF1E6;color:var(--warn)}
.demo{font-size:11px;font-weight:700;color:var(--warn);background:#FFF1E6;border-radius:8px;padding:3px 8px;display:inline-block}
label{font-weight:600;font-size:13px;display:block;margin:10px 0 4px}input[type=text],input[type=number],select{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;font:inherit}
.err{color:#B91C1C;font-size:13px;margin-top:6px;min-height:18px}.opt{width:100%;text-align:left;padding:12px;border:1.5px solid var(--line);border-radius:14px;margin-bottom:8px}.opt.sel{border-color:var(--blue)}.opt.ok{border-color:var(--mint);background:var(--mintbg)}.opt.no{border-color:#DC2626;background:#FEF2F2}
.tg{width:46px;height:26px;border-radius:99px;background:var(--line);position:relative;flex:none}.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.tg.on{background:var(--mint)}.tg.on::after{left:23px}
.modal{position:absolute;inset:0;background:#0b1f4b88;display:flex;align-items:flex-end;z-index:5}.sheet{background:#fff;border-radius:26px 26px 0 0;padding:20px;width:100%;max-height:80%;overflow:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;z-index:99;box-shadow:0 10px 30px #0004}
.dash{max-width:1100px;margin:0 auto;padding:22px 16px 40px}.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.dash .card{padding:18px}.big{font-size:28px;font-weight:800;letter-spacing:-.02em}
.fb{display:flex;align-items:center;gap:10px;margin:8px 0}.fb .l{width:210px;font-size:13px}.fb .b{flex:1;height:30px;border-radius:8px;background:var(--navy);color:#fff;display:flex;align-items:center;padding-left:10px;font-size:12px;font-weight:600}.fb .b.x{background:repeating-linear-gradient(45deg,#fff,#fff 6px,#EEF1F7 6px,#EEF1F7 12px);border:1.5px dashed #9AA6C7;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chips button{padding:7px 12px;border-radius:99px;border:1.5px solid var(--line);font-weight:600;font-size:13px}.chips button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
@media(max-width:480px){.stage{padding:0}.phone{height:calc(100vh - 110px);border-radius:0;box-shadow:none}.fb .l{width:110px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header class="top"><div><span class="brand">ONL <b>ACTIVATE</b></span> <span class="tag">Turn account openings into meaningful first investments.</span></div>
<div class="seg" role="tablist"><button data-a="tab" data-v="customer" id="t-customer">Customer app</button><button data-a="tab" data-v="dash" id="t-dash">Activation Intelligence</button></div>
<div class="row"><button class="pill" data-a="triple" id="tri">3-phone view</button><button class="pill" data-a="reset">Reset demo</button><span class="pill">Demo environment · Sample data</span></div></header>
<main id="cust" class="stage"></main><main id="dash" class="dash" hidden></main><div id="toast" class="toast" role="status" hidden></div>
<script>
"use strict";
/* ---------- State (localStorage with in-memory fallback) ---------- */
const DEF={done:{},funded:0,learn:{},prefs:{remind:true,consent:true,quiet:true,freq:"Weekly"},hide:{},act:[],inv:null,tab:"customer",triple:false};
const clone=o=>JSON.parse(JSON.stringify(o));
let S=load();
function load(){try{return Object.assign(clone(DEF),JSON.parse(localStorage.getItem("onlActivate"))||{})}catch(e){return clone(DEF)}}
function save(){try{localStorage.setItem("onlActivate",JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s);
const inr=n=>"₹"+Math.round(n).toLocaleString("en-IN");
const P=["M5 12l5 5L20 7","M4 5h7a3 3 0 013 3v11a2 2 0 00-2-2H4zM20 5h-6","M3 7h18v12H3zM3 7l2-3h14l2 3M16 13h2","M12 12a4 4 0 100-8 4 4 0 000 8zM4 21a8 8 0 0116 0","M3 11l9-8 9 8v10h-6v-6H9v6H3z","M3 20h18M6 16V9M11 16V4M16 16v-5M21 16V7","M9 9a3 3 0 115 2c-1 1-2 1.5-2 3M12 18h.01M12 22a10 10 0 110-20 10 10 0 010 20","M6 6l12 12M18 6L6 18","M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z","M4 12h16M14 6l6 6-6 6"];
const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="${P[n]}"/></svg>`;
const CK=0,BK=1,WL=2,US=3,HM=4,CH=5,HP=6,XX=7,SH=8,AR=9;
/* ---------- Content ---------- */
const STEPS=[{k:"profile",t:"Complete your profile",d:"Share your goal and experience",go:"sProfile",i:US},{k:"fund",t:"Understand funding methods",d:"Try the demo funding flow",go:"fund",i:WL},{k:"fees",t:"Review fees and charges",d:"See costs in plain language",go:"fees",i:BK},{k:"explore",t:"Explore investment options",d:"Compare illustrative categories",go:"explore",i:CH},{k:"invest",t:"Complete a suitable first investment",d:"Optional. Only if it fits your goal",go:"explore",i:SH}];
const MODS=[
["products","Investment products","Products differ in how they earn, how easily you can exit, and how much they can fall. Knowing the type comes before choosing one.","Match the product to your goal and time horizon.","Which question should come first?",["Which product is trending?","What is my goal and time horizon?","What did friends buy?"],1],
["sip","SIPs and recurring investing","A SIP invests a fixed amount at regular intervals, so you buy at many different prices instead of one.","SIPs build a habit. They do not remove risk or guarantee returns.","What does a SIP do?",["Guarantees a return","Invests a fixed amount regularly","Avoids all losses"],1],
["vol","Market volatility","Prices move up and down. Short-term swings are normal, and they matter most when you may need the money soon.","Money needed soon should not sit in volatile assets.","Volatility mainly means…",["Prices can move sharply","Prices only rise","Charges increase"],0],
["order","Order types","A market order trades at the best available price now. A limit order trades only at your price or better, and may not fill.","Limit orders control price. Market orders prioritise speed.","A limit order…",["Always executes instantly","Executes at your price or better","Cannot be cancelled"],1],
["fees","Fees and charges","Brokerage, taxes and other charges reduce what you keep. Check the full charge list before every order.","Costs are certain. Returns are not.","Why check charges first?",["They reduce what you keep","They never change","They only apply to losses"],0],
["div","Diversification","Spreading money across different assets means one poor result hurts less. It lowers concentration risk but not market risk.","Do not rely on a single holding.","Diversification helps by…",["Guaranteeing profit","Reducing dependence on one holding","Removing all risk"],1],
["risk","Risk and suitability","Suitability means the product fits your goal, horizon and comfort with loss. A product can be good in general and still wrong for you.","Invest only what suits your situation.","A suitable investment is one that…",["Has the highest return","Fits your goal and risk comfort","Is popular online"],1]];
const CATS=[
["debt","Short-term debt funds (illustrative)","Pool money into loans and bonds that mature soon.","Interest earned is spread across holdings.","Interest rates and issuer defaults can reduce value.","Months to 3 years","Fund expense ratio and exit loads may apply."],
["idx","Broad market index funds (illustrative)","Track a market index at low cost.","Value moves with the index.","Can fall sharply in downturns.","5+ years","Expense ratio; taxes on gains."],
["eq","Individual stocks (illustrative)","Part-ownership of one company.","Price follows company results and sentiment.","High concentration risk; can lose most of the value.","5+ years, with research","Brokerage, taxes and other statutory charges."],
["gold","Gold ETFs (illustrative)","Units that track gold prices.","Price follows gold, often moving against equities.","Price can stay flat or fall for years.","3+ years","Expense ratio; brokerage on trades."]];
const HELP={welcome:"Three short steps. You can leave and resume any time.",home:"Pick any card to continue. Learning and exploring do not count as a trade.",journey:"Tap a step to open it. Completed steps stay completed.",fund:"This is a demo. Pick a method, enter an amount, and no money moves.",fees:"Read the charge types, then confirm to mark this step done.",learn:"Each module takes about a minute. Answer the check question to finish it.",explore:"These are illustrative categories, not ONL products or advice.",stack:"All values are demo data and are not real returns.",profile:"Preferences control the simulated reminders.",sProfile:"Two quick questions help tailor learning content, not product advice."};
/* ---------- Phones ---------- */
const phones=[];
function pct(){return Math.round(STEPS.filter(s=>S.done[s.k]).length/STEPS.length*100)}
function nextStep(){return STEPS.find(s=>!S.done[s.k])}
function mount(){const c=$("#cust");c.innerHTML="";phones.length=0;const starts=S.triple?["welcome","home","stack"]:["home"];starts.forEach((st,i)=>{const d=document.createElement("div");d.className="phone";d.dataset.i=i;c.appendChild(d);phones.push({el:d,scr:st,arg:null,pick:null,modal:false,sel:null,range:"3M",err:"",meth:null})});phones.forEach(render)}
function go(p,scr,arg){p.scr=scr;p.arg=arg||null;p.pick=null;p.err="";p.modal=false;render(p)}
const NAVMAP={home:"home",welcome:"",journey:"journey",sProfile:"journey",fund:"journey",fees:"journey",explore:"journey",confirm:"journey",done:"journey",learn:"learn",module:"learn",stack:"stack",profile:"profile"};
function render(p){const top=p.el.querySelector(".scr");const y=top?top.scrollTop:0;const n=NAVMAP[p.scr];
const nv=[["home","Home",HM],["journey","My Journey",CK],["learn","Learn",BK],["stack","Portfolio",CH],["profile","Profile",US]].map(([k,l,i])=>`<button data-a="nav" data-v="${k}" class="${n===k?"on":""}" aria-label="${l}">${ic(i)}${l}</button>`).join("");
p.el.innerHTML=`<div class="scr" tabindex="-1">${SCR[p.scr](p)}</div><nav class="nav" aria-label="Main">${nv}</nav>${p.modal?`<div class="modal" data-a="closeM"><div class="sheet" role="dialog" aria-label="Help"><h3>Help for this screen</h3><p>${HELP[p.scr]||HELP.home}</p><p class="mut">Need more? Support is available 8am–8pm (demo).</p><button class="btn" data-a="closeM">Got it</button></div></div>`:""}`;
p.el.querySelector(".scr").scrollTop=y}
const rerender=()=>phones.forEach(render);
const head=(t,back,p)=>`<div class="row sp" style="margin-bottom:6px">${back?`<button data-a="nav" data-v="${back}" aria-label="Back" style="transform:rotate(180deg)">${ic(AR)}</button>`:"<span></span>"}<button data-a="help" aria-label="Help" class="ico" style="width:34px;height:34px">${ic(HP)}</button></div>${t?`<h1>${t}</h1>`:""}`;
const ring=v=>`<svg width="84" height="84" viewBox="0 0 84 84" aria-label="${v}% complete"><circle cx="42" cy="42" r="34" fill="none" stroke="#ffffff33" stroke-width="9"/><circle cx="42" cy="42" r="34" fill="none" stroke="#5EEAD4" stroke-width="9" stroke-linecap="round" stroke-dasharray="${2.136*v*1} 214" transform="rotate(-90 42 42)"/><text x="42" y="47" text-anchor="middle" fill="#fff" font-weight="800" font-size="17">${v}%</text></svg>`;
const stepBtn=s=>`<button class="step" data-a="go" data-v="${s.go}"><span class="chk ${S.done[s.k]?"d":""}">${S.done[s.k]?ic(CK):""}</span><span class="grow"><b>${s.t}</b><br><span class="mut">${S.done[s.k]?"Completed":s.d}</span></span>${ic(AR)}</button>`;
const demoTag='<span class="demo">Demo · No real money moves</span>';
/* ---------- Screens ---------- */
const SCR={
welcome:p=>`${head("",0,p)}<div class="card hero" style="text-align:center"><svg viewBox="0 0 300 120" width="100%" aria-hidden="true"><path d="M10 100 C60 90 80 40 130 60 S210 20 290 14" fill="none" stroke="#5EEAD4" stroke-width="4" stroke-linecap="round"/><circle cx="130" cy="60" r="7" fill="#fff"/><circle cx="290" cy="14" r="7" fill="#5EEAD4"/></svg></div><h1>Your investing journey starts here.</h1><p class="mut">Three short steps. Go at your pace, learn first, and invest only if it suits you.</p>${[["Build your profile",US],["Understand funding and charges",WL],["Explore your first investment",CH]].map((x,i)=>`<div class="row card" style="padding:10px"><span class="chk ${(i==0&&S.done.profile)||(i==1&&S.done.fund&&S.done.fees)||(i==2&&S.done.explore)?"d":""}">${(i==0&&S.done.profile)||(i==1&&S.done.fund&&S.done.fees)||(i==2&&S.done.explore)?ic(CK):i+1}</span><b>${x[0]}</b></div>`).join("")}<div class="bar" style="margin:12px 0"><i style="width:${pct()}%"></i></div><button class="btn m" data-a="go" data-v="${(nextStep()||STEPS[0]).go}">${pct()?"Continue":"Start my journey"}</button><button class="btn g" style="margin-top:8px" data-a="nav" data-v="home">Come back later</button>`,
home:p=>{const n=nextStep();return `${head("",0,p)}<p class="mut" style="margin:0">Good morning,</p><h1 style="margin-top:0">Rahul</h1><span class="badge">${pct()==100?"Journey complete":"Your journey is in progress"}</span>
<div class="card hero row sp" style="margin-top:14px"><div><b style="font-size:17px">${STEPS.filter(s=>S.done[s.k]).length} of 5 steps done</b><p class="mut" style="margin:4px 0 0">Learning and funding prepare you. Only an executed trade counts as activation.</p></div>${ring(pct())}</div>
${n?`<h2>Continue where you left off</h2>${stepBtn(n)}`:""}<h2>Quick actions</h2>
${[["Add demo funds",WL,"fund","Try the funding flow"],["Review fees",BK,"fees","Know the costs first"],["Learn in 1 minute",BK,"learn","7 short modules"],["Explore options",CH,"explore","Illustrative categories"]].map(a=>`<button class="step" data-a="go" data-v="${a[2]}"><span class="ico m">${ic(a[1])}</span><span class="grow"><b>${a[0]}</b><br><span class="mut">${a[3]}</span></span>${ic(AR)}</button>`).join("")}
${S.hide.tip?"":`<div class="card" style="background:var(--mintbg)"><div class="row sp"><b>Insight</b><button data-a="hide" data-v="tip" aria-label="Dismiss insight">${ic(XX)}</button></div><p style="margin:6px 0 0">A SIP spreads purchases over time. It does not guarantee returns. <button data-a="mod" data-v="sip" style="color:var(--blue);font-weight:700">Learn how</button></p></div>`}<span class="demo">Demo environment · Sample data</span>`},
journey:p=>`${head("My Journey",0,p)}<p class="mut">${pct()}% complete. Funding and exploring are preparation. A demo trade is shown only to illustrate the flow.</p><div class="bar" style="margin-bottom:14px"><i style="width:${pct()}%"></i></div>${STEPS.map(stepBtn).join("")}`,
sProfile:p=>`${head("Your profile","journey",p)}<label for="goal">What is your main goal?</label><select id="goal"><option>Build long-term savings</option><option>Save for a specific purchase</option><option>Learn first, decide later</option></select><label for="exp">Investing experience</label><select id="exp"><option>New to investing</option><option>Some experience</option><option>Experienced</option></select><p class="mut" style="margin-top:12px">Used to pick learning content. It is not financial advice.</p><button class="btn m" data-a="done" data-v="profile">Save profile</button>`,
fund:p=>{const M=["Linked bank account","UPI","Net banking"];if(p.meth==null)p.meth=0;if(p.arg==="ok")return `${head("","journey",p)}<div class="card" style="text-align:center"><div class="ico m" style="margin:0 auto 10px">${ic(CK)}</div><h1>Demo funding complete</h1><p>${inr(S.act[0]?S.act[0].amt:0)} added to your demo balance of ${inr(S.funded)}.</p>${demoTag}<p class="mut" style="margin-top:10px">Next: review fees, then explore options. No real money was transferred.</p></div><button class="btn m" data-a="go" data-v="fees">Review fees</button>`;
return `${head("Add funds","journey",p)}${demoTag}<p class="mut" style="margin-top:8px">Demo funding flow. No real money will be transferred.</p>${M.map((m,i)=>`<button class="step" data-a="meth" data-v="${i}" style="${p.meth===i?"border-color:var(--blue)":""}"><span class="ico">${ic(WL)}</span><b class="grow">${m}</b>${p.meth===i?ic(CK):""}</button>`).join("")}<label for="amt">Amount (₹500 to ₹1,00,000)</label><input id="amt" type="number" inputmode="numeric" placeholder="e.g. 5000"><div class="err" role="alert">${p.err}</div><p class="mut">What happens next: your demo balance updates and this step completes. <button data-a="go" data-v="fees" style="color:var(--blue);font-weight:700">View charges</button></p><button class="btn m" data-a="fundGo">Add demo funds</button>`},
fees:p=>`${head("Fees and charges","journey",p)}${[["Brokerage","Charged by the platform per order. Shown before you confirm."],["Statutory taxes and levies","Set by authorities. Added to relevant orders."],["Fund expense ratio","Yearly cost inside a fund. It lowers returns."],["Exit loads","Some funds charge if you sell early."]].map(f=>`<div class="card"><h3>${f[0]}</h3><p class="mut" style="margin:0">${f[1]}</p></div>`).join("")}<p class="mut">Illustrative explanations. Check the official charge schedule before trading.</p><button class="btn m" data-a="done" data-v="fees">I have reviewed the charges</button>`,
learn:p=>`${head("Investor Learning Hub",0,p)}<p class="mut">${Object.keys(S.learn).length} of 7 modules complete.</p><div class="bar" style="margin-bottom:12px"><i style="width:${Object.keys(S.learn).length/7*100}%"></i></div>${MODS.map(m=>`<button class="step" data-a="mod" data-v="${m[0]}"><span class="chk ${S.learn[m[0]]?"d":""}">${S.learn[m[0]]?ic(CK):""}</span><span class="grow"><b>${m[1]}</b><br><span class="mut">About 1 minute</span></span>${ic(AR)}</button>`).join("")}`,
module:p=>{const m=MODS.find(x=>x[0]===p.arg);const a=p.pick;const ok=a===m[6];return `${head(m[1],"learn",p)}<p>${m[2]}</p><div class="card" style="background:var(--mintbg)"><b>Key takeaway.</b> ${m[3]}</div><h3>Check yourself</h3><p>${m[4]}</p>${m[5].map((o,i)=>`<button class="opt ${a==null?"":i===m[6]?"ok":i===a?"no":""}" data-a="pick" data-v="${i}" ${a!=null?"disabled":""}>${o}</button>`).join("")}${a==null?"":ok?`<p><b>Correct.</b> ${m[3]}</p><button class="btn m" data-a="modDone" data-v="${m[0]}">Continue</button>`:`<p><b>Not quite.</b> Re-read the explanation above and try again.</p><button class="btn" data-a="retry">Try again</button>`}`},
explore:p=>`${head("Explore options","journey",p)}<span class="demo">Illustrative categories · Not ONL products or advice</span>${CATS.map(c=>`<div class="card"><div class="row sp"><h3>${c[1]}</h3></div><p class="mut">${c[2]}</p>${p.sel===c[0]?`<p><b>How it works.</b> ${c[3]}</p><p><b>Risks.</b> ${c[4]}</p><p><b>Indicative horizon.</b> ${c[5]}</p><p><b>Charges.</b> ${c[6]}</p><button class="btn sm m" data-a="pickCat" data-v="${c[0]}">Consider a demo order</button> `:""}<button class="btn sm g" data-a="learnMore" data-v="${c[0]}">${p.sel===c[0]?"Show less":"Learn more"}</button></div>`).join("")}${S.done.explore?"":`<button class="btn m" data-a="done" data-v="explore">I have explored the options</button>`}`,
confirm:p=>{const c=CATS.find(x=>x[0]===p.arg);return `${head("Confirm demo order","explore",p)}${demoTag}<div class="card"><b>${c[1]}</b><p class="mut">Balance: ${inr(S.funded)}. ${S.funded<500?"Add demo funds first.":""}</p><label for="ia">Amount (₹)</label><input id="ia" type="number" inputmode="numeric"><label style="display:flex;gap:8px;align-items:flex-start;font-weight:500"><input type="checkbox" id="rk" style="margin-top:3px"> I understand this can lose value, returns are not guaranteed, and this suits my goal and horizon.</label><div class="err" role="alert">${p.err}</div></div><button class="btn m" data-a="invGo" data-v="${c[0]}">Place demo order</button><button class="btn g" style="margin-top:8px" data-a="go" data-v="explore">Cancel and go back</button><p class="mut">Simulated only. No trade is placed.</p>`},
done:p=>`${head("","journey",p)}<div class="card" style="text-align:center"><div class="ico m" style="margin:0 auto 10px">${ic(SH)}</div><h1>Demo order recorded</h1><p>${inr(S.inv.amt)} in ${S.inv.name}.</p>${demoTag}<p class="mut" style="margin-top:10px">In the live product, an executed trade is what the case counts as activation.</p></div><button class="btn m" data-a="nav" data-v="stack">View portfolio</button>`,
stack:p=>{const v=S.funded+(S.inv?S.inv.amt:0);const N={"1M":22,"3M":30,"6M":36,"1Y":48,ALL:60}[p.range];let pts="",d=[];if(v>0){let x=v*.9;for(let i=0;i<N;i++){x+=Math.sin(i*1.3)*v*.012+(i/N)*v*.004;d.push(x)}d[N-1]=v;const mn=Math.min(...d),mx=Math.max(...d)||1;pts=d.map((y,i)=>`${i/(N-1)*300},${100-(y-mn)/((mx-mn)||1)*80-10}`).join(" ")}
return `${head("My Stack",0,p)}<span class="demo">Demo data · Not real returns</span><div class="card hero" style="margin-top:10px"><p class="mut" style="margin:0">Illustrative portfolio value</p><div class="big">${inr(v)}</div></div>${v>0?`<div class="card"><svg viewBox="0 0 300 110" width="100%" role="img" aria-label="Demo chart"><polyline points="${pts}" fill="none" stroke="#12B5A0" stroke-width="3" stroke-linejoin="round"/></svg><div class="chips" role="group">${["1M","3M","6M","1Y","ALL"].map(r=>`<button data-a="range" data-v="${r}" class="${p.range===r?"on":""}">${r}</button>`).join("")}</div></div>`:`<div class="card"><b>Nothing here yet.</b><p class="mut">Add demo funds to see the chart.</p></div>`}<button class="btn m" data-a="go" data-v="fund">Add demo funds</button><h2>Activity</h2>${S.act.length?S.act.map(a=>`<div class="row sp card" style="padding:10px"><span>${a.t}</span><b>${inr(a.amt)}</b></div>`).join(""):'<p class="mut">No activity yet.</p>'}<div class="card" style="background:var(--mintbg)"><b>Reading this screen.</b> Balances show only what you entered in this demo. Past or demo moves do not predict outcomes.</div>`},
profile:p=>{const q=S.prefs;const tg=(k,l)=>`<div class="row sp card" style="padding:12px"><span>${l}</span><button class="tg ${q[k]?"on":""}" data-a="tg" data-v="${k}" role="switch" aria-checked="${q[k]}" aria-label="${l}"></button></div>`;return `${head("Profile",0,p)}<div class="row card"><span class="ico">${ic(US)}</span><div><b>Rahul (sample)</b><br><span class="badge ${pct()==100?"":"o"}">${pct()==100?"Journey complete":"Journey in progress"}</span></div></div>${tg("consent","Allow personalised learning prompts")}${tg("remind","Simulated reminders")}${tg("quiet","Quiet hours 9pm to 8am")}<label for="fq">Reminder frequency</label><select id="fq" data-c="freq" ${q.remind&&q.consent?"":"disabled"}>${["Weekly","Fortnightly","Monthly"].map(f=>`<option ${q.freq===f?"selected":""}>${f}</option>`).join("")}</select><p class="mut" style="margin-top:8px">${q.remind&&q.consent?`You will see up to one ${q.freq.toLowerCase()} reminder${q.quiet?", never during quiet hours":""}.`:"Reminders are off. You will not be nudged."}</p><h2>Learning progress</h2><div class="bar"><i style="width:${Object.keys(S.learn).length/7*100}%"></i></div><p class="mut">${Object.keys(S.learn).length} of 7 modules complete</p><button class="btn g" data-a="reset">Reset demo</button>`}};
/* ---------- Actions ---------- */
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2200)}
function complete(k,msg){if(!S.done[k]){S.done[k]=1;toast(msg||"Step completed")}save()}
const ACT={
tab:(p,v)=>{S.tab=v;save();view()},triple:()=>{S.triple=!S.triple;save();view();mount()},
reset:()=>{S=clone(DEF);save();mount();view();dashInit();toast("Demo reset")},
nav:(p,v)=>go(p,v),go:(p,v)=>go(p,v),help:p=>{p.modal=true;render(p)},closeM:(p,v,t)=>{if(t.classList.contains("modal")||t.classList.contains("btn")){p.modal=false;render(p)}},
hide:(p,v)=>{S.hide[v]=1;save();rerender()},
done:(p,v)=>{complete(v);rerender();go(p,"journey")},
meth:(p,v)=>{p.meth=+v;render(p)},
fundGo:p=>{const a=p.el.querySelector("#amt").value;const n=Number(a);if(!a)p.err="Enter an amount to continue.";else if(!Number.isInteger(n))p.err="Use a whole-rupee amount.";else if(n<500)p.err="Minimum demo amount is ₹500.";else if(n>100000)p.err="Maximum demo amount is ₹1,00,000.";else{S.funded+=n;S.act.unshift({t:"Demo funding",amt:n});complete("fund","Demo funds added");rerender();return go(p,"fund","ok")}p.el.querySelector(".err").textContent=p.err},
mod:(p,v)=>go(p,"module",v),pick:(p,v)=>{p.pick=+v;render(p)},retry:p=>{p.pick=null;render(p)},
modDone:(p,v)=>{S.learn[v]=1;save();toast("Module complete");go(p,"learn")},
learnMore:(p,v)=>{p.sel=p.sel===v?null:v;render(p)},pickCat:(p,v)=>{complete("explore");go(p,"confirm",v)},
invGo:(p,v)=>{const c=CATS.find(x=>x[0]===v),n=Number(p.el.querySelector("#ia").value);if(!p.el.querySelector("#rk").checked)p.err="Tick the risk confirmation to continue.";else if(!(n>=500))p.err="Enter at least ₹500.";else if(n>S.funded)p.err="Amount exceeds your demo balance. Add demo funds first.";else{S.funded-=n;S.inv={name:c[1].replace(" (illustrative)",""),amt:n+(S.inv?S.inv.amt:0)};S.act.unshift({t:"Demo order",amt:n});complete("invest","Demo order recorded");rerender();return go(p,"done")}p.el.querySelector(".err").textContent=p.err},
range:(p,v)=>{p.range=v;render(p)},
tg:(p,v)=>{S.prefs[v]=!S.prefs[v];save();toast(S.prefs[v]?"Turned on":"Turned off");rerender()}};
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t)return;const ph=t.closest(".phone");const p=ph?phones[+ph.dataset.i]:null;const f=ACT[t.dataset.a]||DACT[t.dataset.a];if(f)f(p,t.dataset.v,t)});
document.addEventListener("change",e=>{if(e.target.dataset.c==="freq"){S.prefs.freq=e.target.value;save();toast("Frequency saved");rerender()}if(e.target.id==="sim"){simUpdate()}});
function view(){const c=S.tab==="customer";$("#cust").hidden=!c;$("#dash").hidden=c;$("#t-customer").classList.toggle("on",c);$("#t-dash").classList.toggle("on",!c);$("#tri").style.display=c?"":"none";$("#tri").textContent=S.triple?"1-phone view":"3-phone view"}
/* ---------- Dashboard ---------- */
const BASE=809746,ACTIVE=119339;
let EX={sel:0,res:null,n:0};
const EXPS=[["Persistent activation checklist",.112,.131],["Contextual help",.108,.121],["Investor Learning Hub",.104,.119],["Consent-based stage-triggered nudges",.110,.126]];
function rnd(seed){let x=Math.sin(seed*9301+49297)*233280;return x-Math.floor(x)}
function gauss(s){return (rnd(s)+rnd(s+1)+rnd(s+2)+rnd(s+3)-2)*1.7}
function cdf(z){const t=1/(1+.2316419*Math.abs(z)),d=.3989423*Math.exp(-z*z/2),p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p}
function runExp(){const [,pc,pt]=EXPS[EX.sel],n=2400;EX.n++;const s=EX.n*7+EX.sel*31;const cc=Math.round(n*pc+gauss(s)*Math.sqrt(n*pc*(1-pc))),tc=Math.round(n*pt+gauss(s+9)*Math.sqrt(n*pt*(1-pt)));const a=cc/n,b=tc/n,pp=(cc+tc)/(2*n),se=Math.sqrt(pp*(1-pp)*2/n),z=(b-a)/se,pv=2*(1-cdf(Math.abs(z)));EX.res={n,a,b,pv,z};dashRender()}
function simUpdate(){const b=+$("#sim").value;$("#simo").innerHTML=`<div class="big">${(14.74+b/100).toFixed(2)}%</div><p class="mut">Target activation rate</p><div class="big">+${Math.round(BASE*b/10000).toLocaleString("en-IN")}</div><p class="mut">Incremental active accounts (${BASE.toLocaleString("en-IN")} × ${(b/100).toFixed(2)} percentage points). Target scenario, not a forecast.</p>`;$("#simb").textContent="+"+b+" bps"}
const DACT={exp:(p,v)=>{EX.sel=+v;EX.res=null;dashRender()},run:runExp};
function dashInit(){EX={sel:0,res:null,n:0};dashRender()}
function dashRender(){const r=EX.res,e=EXPS[EX.sel];const gm=[["Complaints per 1,000 users","1.8","≤ 2.5",1.8<=2.5],["Opt-out rate","2.1%","≤ 3%",true],["Failed funding attempts","3.4%","≤ 5%",true],["Learning-module completion","61%","≥ 50%",true],["Risk-awareness completion","94%","≥ 90%",true]];
$("#dash").innerHTML=`<span class="demo">Illustrative demo data unless marked "Case"</span>
<h2>Baseline and target</h2><div class="grid">${[["Eligible accounts","809,746","Case · Sep 2026"],["Active accounts","119,339","Case · Sep 2026"],["Activation rate","14.74%","Case · baseline"],["Target lift","+200–300 bps","Case · 3-month target"],["Additional active accounts","16,195–24,292","Target on fixed base"]].map(k=>`<div class="card"><div class="mut">${k[0]}</div><div class="big">${k[1]}</div><span class="badge ${k[2].includes("Target")||k[2].includes("target")?"o":""}">${k[2]}</span></div>`).join("")}</div>
<h2>Activation funnel</h2><div class="card">${[["Eligible account","809,746 · Case",100,0],["First login","Event data required",0,1],["Funding completed","Event data required",0,1],["First investment / executed trade","119,339 active (≥1 trade in 12 months) · Case",14.74,0],["Repeat activity","Event data required",0,1]].map(f=>`<div class="fb"><div class="l">${f[0]}</div><div class="b ${f[3]?"x":""}" style="${f[3]?"":`max-width:${Math.max(f[2],34)}%;flex:none;width:${Math.max(f[2],34)}%`}">${f[1]}</div></div>`).join("")}<p class="mut">Intermediate stage counts are not in the case. Instrumenting these events is step one of the plan.</p></div>
<h2>Segment prioritisation</h2><div class="card"><table><tr><th>Segment</th><th>Accounts</th><th>Active rate</th><th>Read-out</th></tr><tr><td>Salary Account</td><td>627,853</td><td>14%</td><td>Large-scale opportunity</td></tr><tr><td>Credit Card</td><td>73,317</td><td>6%</td><td>Low activation. Diagnose before acting</td></tr></table>${[["Salary Account",627853,14],["Credit Card",73317,6]].map(s=>`<div class="fb"><div class="l">${s[0]}</div><div class="b" style="width:${s[2]*5}%;flex:none;min-width:70px;background:var(--blue)">${s[2]}%</div></div>`).join("")}<p class="mut">Case data. Rates alone do not show why a segment is low.</p></div>
<h2>Experimentation centre</h2><div class="card"><div class="chips" role="group">${EXPS.map((x,i)=>`<button data-a="exp" data-v="${i}" class="${EX.sel===i?"on":""}">${x[0]}</button>`).join("")}</div><button class="btn sm" data-a="run">Run demo experiment</button> <span class="demo">Illustrative demo data</span>${r?`<table style="margin-top:10px"><tr><th></th><th>Sample</th><th>Conversion</th></tr><tr><td>Control</td><td>${r.n}</td><td>${(r.a*100).toFixed(1)}%</td></tr><tr><td>Treatment</td><td>${r.n}</td><td>${(r.b*100).toFixed(1)}%</td></tr></table><p>Absolute lift <b>${((r.b-r.a)*100).toFixed(1)} pp</b> · Relative lift <b>${((r.b/r.a-1)*100).toFixed(1)}%</b> · z = ${r.z.toFixed(2)}, p = ${r.pv<.001?"<0.001":r.pv.toFixed(3)} (two-proportion test, simulated data). ${r.pv<.05?"Significant at the 5% level in this simulation.":"Not significant at the 5% level in this simulation."}</p>`:'<p class="mut" style="margin-top:10px">Press the button to simulate a treatment and control group.</p>'}</div>
<h2>Three-month target simulator</h2><div class="card"><label for="sim">Improvement: <b id="simb">+250 bps</b></label><input id="sim" type="range" min="200" max="300" step="50" value="250" style="width:100%"><div id="simo"></div><p class="mut">+200 bps means +2 percentage points, not +200%.</p></div>
<h2>Guardrail metrics</h2><div class="grid">${gm.map(g=>`<div class="card"><div class="mut">${g[0]}</div><div class="big">${g[1]}</div><span class="badge ${g[3]?"":"o"}">${g[3]?"Within limit":"Breach"} ${g[2]}</span></div>`).join("")}</div><p class="mut">Illustrative demo metrics. Activation lift only counts as success if complaints, errors, and consent violations stay within limits.</p>`;simUpdate()}
/* ---------- Boot ---------- */
view();mount();dashInit();
</script></body></html>
